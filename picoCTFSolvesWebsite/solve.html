<script>
const params = new URLSearchParams(location.search);
const slug = params.get("slug");
const solve = SOLVES.find((s) => s.slug === slug);
const content = document.getElementById("content");

// Placeholder copy for challenges without a write-up. It's deliberately generic
// filler: it says nothing about how the challenge is actually solved.
const LOREM = [
  "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.",
  "Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.",
  "Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.",
];
const bars = (widths) => `<div class="bars" aria-hidden="true">${widths.map((w) => `<i style="width:${w}%"></i>`).join("")}</div>`;
function placeholderWriteup() {
  return `
    <div class="locked-note" role="note">&#9632; Write-up in progress &middot; the text below is placeholder only</div>
    <div class="placeholder">
      <section><h3>Overview</h3><p>${LOREM[0]}</p>${bars([92, 78])}</section>
      <section><h3>Approach</h3><p>${LOREM[1]}</p>${bars([86, 64, 72])}</section>
      <section><h3>Walkthrough</h3><p>${LOREM[2]}</p><pre aria-hidden="true">$ placeholder --command
lorem ipsum dolor sit amet</pre></section>
      <section><h3>Flag</h3><p>picoCTF{&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;}</p></section>
    </div>`;
}

if (!solve) {
  content.innerHTML = `<p class="not-found">No write-up found for &ldquo;${escapeHtml(slug || "")}&rdquo;.<br><br>
    <a class="btn-line" href="/picoctf">All categories <span class="arr" aria-hidden="true">&rarr;</span></a></p>`;
} else {
  document.title = `${solve.title} - picoCTF Solves`;
  // point the canonical link at this specific solve
  document.querySelector('link[rel="canonical"]').href =
    `https://zackcrawford.com/picoctf/solve?slug=${encodeURIComponent(solve.slug)}`;

  const solved = isSolved(solve);
  document.documentElement.style.setProperty("--gc", [1, 3, 5].map((i) => parseInt((CATEGORY_COLOR[solve.category] || "#4fe0c8").slice(i, i + 2), 16)).join(","));
  const color = CATEGORY_COLOR[solve.category] || "#4fe0c8";
  const dColor = (DIFFICULTY_META[solve.difficulty] || {}).color || "var(--muted)";
  // neighbours in the same category and difficulty
  const siblings = SOLVES.filter((s) => s.category === solve.category && s.difficulty === solve.difficulty);
  const idx = siblings.indexOf(solve);
  const prev = siblings[idx - 1], next = siblings[idx + 1];

  const hintsHtml = solve.hints.length
    ? `<details class="hints panel" style="--c:var(--amber)"><summary>Show hints (${solve.hints.length})</summary>
        <ul>${solve.hints.map((h) => `<li>${escapeHtml(h)}</li>`).join("")}</ul></details>`
    : "";
  // keep each quoted hint line on its own line
  const notesMd = (solve.notes || "").replace(/\n>/g, "\n>\n>");
  const notesHtml = solve.notes ? `<div class="block panel" style="--c:var(--amber)"><h2>Notes</h2>${renderMarkdown(notesMd)}</div>` : "";
  const flagHtml = solved && solve.flag
    ? `<div class="flag-row panel"><span class="lab">Flag</span>
        <code class="flag-value" id="flag-value">${escapeHtml(solve.flag)}</code>
        <button id="reveal-btn" type="button" aria-controls="flag-value" aria-pressed="false">Reveal flag</button></div>`
    : "";
  const referencesHtml = solve.references.length
    ? `<div class="references"><h2>References</h2>
        <ul>${solve.references.map((r) => /^https?:\/\//i.test(r.url || "")
          ? `<li><a href="${escapeHtml(r.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(r.text)}</a></li>`
          : `<li>${escapeHtml(r.text)}</li>`).join("")}</ul></div>`
    : "";
  const pagerLink = (s, cls, label) => s
    ? `<a class="${cls}" href="/picoctf/solve?slug=${encodeURIComponent(s.slug)}" aria-keyshortcuts="${cls === "prev" ? "ArrowLeft" : "ArrowRight"}">${label}<b>${escapeHtml(s.title)}</b></a>` : "";

  content.innerHTML = `
    <h1 class="title" style="view-transition-name:vt-${solve.slug}"><span class="glitch" data-text="${escapeHtml(solve.title)}">${escapeHtml(solve.title)}</span></h1>
    <ul class="chips">
      <li><span class="dot" style="background:${dColor}"></span><b>${escapeHtml(solve.difficulty)}</b></li>
      <li><span class="dot" style="background:${color}"></span>${escapeHtml(solve.category)}</li>
      ${solve.event && solve.event !== "N/A" ? `<li>${escapeHtml(solve.event)}</li>` : ""}
      ${solve.author ? `<li>By ${escapeHtml(solve.author)}</li>` : ""}
      <li class="${solved ? "done" : ""}">${solved ? "&#10003; Write-up" : "&#9632; Locked"}</li>
    </ul>
    ${solve.description ? `<div class="block panel" style="--c:${color}"><h2>Challenge</h2>${renderMarkdown(solve.description)}</div>` : ""}
    ${hintsHtml}
    ${notesHtml}
    ${flagHtml}
    <div class="writeup-head"><h2>Write-up</h2></div>
    ${solved ? `<div class="solution">${renderMarkdown(solve.solutionMd)}</div>` : placeholderWriteup()}
    ${referencesHtml}
    <nav class="pager" aria-label="More ${escapeHtml(solve.difficulty)} ${escapeHtml(solve.category)} challenges">
      ${pagerLink(prev, "prev", "&larr; Previous")}
      ${next ? pagerLink(next, "next", "Next &rarr;") : `<a class="next" href="${categoryUrl(solve.category, solve.difficulty)}">Back to list<b>${escapeHtml(solve.category)}</b></a>`}
    </nav>`;

  // ---------- build the terminal: bar (title) + screen (everything else) ----------
  const term = document.createElement("div");
  term.className = "term";
  const bar = document.createElement("header");
  bar.className = "term-bar";
  bar.innerHTML = `<div class="term-top">
      <button type="button" class="back-cat" id="back-cat">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back to ${escapeHtml(solve.category)} <kbd class="k" aria-hidden="true">Esc</kbd>
      </button>
      <span class="term-status"><i aria-hidden="true"></i>${solved ? "Write-up decrypted" : "Write-up locked"}</span>
    </div>`;
  const screen = document.createElement("div");
  screen.className = "term-screen";
  screen.innerHTML = `<span class="term-scan" aria-hidden="true"></span><div class="term-body"></div>`;
  const body = screen.querySelector(".term-body");
  const nodes = Array.from(content.children);
  nodes.forEach((n) => (n.matches("h1.title, ul.chips") ? bar : body).appendChild(n));
  Array.from(body.children).forEach((n, i) => n.style.setProperty("--i", Math.min(i, 12)));
  bar.style.viewTransitionName = `vt-card-${solve.slug}`;
  term.append(bar, screen);
  content.appendChild(term);
  glitch(bar.querySelector(".glitch"), 120);

  const rm = document.documentElement.classList.contains("rm");
  // browsers that morph between pages (cross-document View Transitions)
  const canMorph = "CSSViewTransitionRule" in window && !rm;
  if (canMorph) document.documentElement.classList.add("vt");
  const scan = screen.querySelector(".term-scan");
  const easeIO = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  // animate the screen's visible height from 0 down to the bottom of the viewport
  function sweep(open, ms, done) {
    const H = screen.offsetHeight;
    const reach = Math.min(H, Math.max(160, innerHeight - screen.getBoundingClientRect().top + 30));
    const t0 = performance.now();
    scan.style.opacity = "1";
    (function step(now) {
      const p = Math.min(1, (now - t0) / ms), e = easeIO(open ? p : 1 - p), shown = e * reach;
      screen.style.clipPath = `inset(0 0 ${Math.max(0, H - shown)}px 0)`;
      scan.style.top = `${shown}px`;
      if (p < 1) requestAnimationFrame(step);
      else { scan.style.opacity = "0"; if (open) screen.style.clipPath = ""; done && done(); }
    })(t0);
  }
  // decode effect on section headings as they fill in
  function decode(el, delay) {
    const final = el.textContent, chars = "!<>-_\\/[]{}=+*^?#01ABCDEF";
    setTimeout(() => {
      let f = 0;
      const id = setInterval(() => {
        f++;
        el.textContent = final.split("").map((ch, i) => (i < f / 2 || ch === " " ? ch : chars[(Math.random() * chars.length) | 0])).join("");
        if (f / 2 >= final.length) { clearInterval(id); el.textContent = final; }
      }, 28);
    }, delay);
  }
  if (rm) {
    term.classList.add("open", "filled");
  } else {
    screen.style.clipPath = "inset(0 0 100% 0)";
    setTimeout(() => sweep(true, 750, () => {
      term.classList.add("filled");
      body.querySelectorAll(":scope > .block > h2, :scope > .writeup-head h2, :scope > .references h2").forEach((h, i) => decode(h, 120 + i * 90));
    }), 450);
  }

  // ---------- back out: collapse the screen, then zoom out to the category ----------
  let leaving = false;
  function leave() {
    if (leaving) return;
    leaving = true;
    try { sessionStorage.setItem("pico-from-solve", "1"); } catch (e) { /* private mode */ }
    let ref = null;
    try { ref = document.referrer ? new URL(document.referrer) : null; } catch (e) { /* ignore */ }
    const cameFromList = ref && ref.origin === location.origin && (ref.pathname === "/picoctf" || ref.pathname === "/picoctf/category");
    const go = () => {
      if (cameFromList && history.length > 1) history.back();
      else location.href = categoryUrl(solve.category, solve.difficulty);
    };
    if (rm) return go();
    // 1. the write-up fades and the page glides back to the header
    term.classList.add("closing");
    window.scrollTo({ top: 0, behavior: "smooth" });
    const t0 = performance.now();
    (function waitTop() {
      if (scrollY > 2 && performance.now() - t0 < 700) return requestAnimationFrame(waitTop);
      window.scrollTo({ top: 0, behavior: "instant" });
      // 2. the screen collapses up into the header, which stays put
      sweep(false, 520, () => {
        screen.style.visibility = "hidden";
        // 3. the header shrinks back into its card on the category page
        setTimeout(go, canMorph ? 60 : 220);
      });
    })();
  }
  document.getElementById("back-cat").addEventListener("click", leave);
  addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !document.querySelector(".cmdk:not([hidden])")) leave();
  });
  addEventListener("pageshow", (e) => { if (e.persisted) { leaving = false; term.classList.remove("closing"); screen.style.clipPath = ""; screen.style.visibility = ""; } });

  // left/right arrows step through the problems in this difficulty
  document.addEventListener("keydown", (e) => {
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || document.querySelector(".cmdk:not([hidden])")) return;
    if (e.key === "ArrowLeft" && prev) location.href = `/picoctf/solve?slug=${encodeURIComponent(prev.slug)}`;
    if (e.key === "ArrowRight") location.href = next ? `/picoctf/solve?slug=${encodeURIComponent(next.slug)}` : categoryUrl(solve.category, solve.difficulty);
  });

  const revealBtn = document.getElementById("reveal-btn");
  if (revealBtn) {
    revealBtn.addEventListener("click", () => {
      const revealed = document.getElementById("flag-value").classList.toggle("revealed");
      revealBtn.textContent = revealed ? "Hide flag" : "Reveal flag";
      revealBtn.setAttribute("aria-pressed", String(revealed));
    });
  }
}
</script>
<script>
(function () {
  const btns = document.querySelectorAll(".bgtoggle button");
  function set(mode) {
    document.body.classList.toggle("solid-bg", mode === "solid");
    btns.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.bg === mode)));
    try { localStorage.setItem("pico-bg", mode); } catch (e) { /* private mode */ }
  }
  let saved = "dots";
  try { saved = localStorage.getItem("pico-bg") || "dots"; } catch (e) { /* private mode */ }
  set(saved);
  btns.forEach((b) => b.addEventListener("click", () => set(b.dataset.bg)));
})();
</script>
<script>
// Background: a honeycomb of faint dots. Moving the pointer lights the nearest
// hexagon edge in the category colour; it holds for 3.8s, then fades out slowly.
(function () {
  const cv = document.getElementById("hex"), g = cv.getContext("2d");
  const L = 22;                                  // edge length (px)
  const W = Math.sqrt(3) * L, ROW = 1.5 * L;     // pointy-top hex spacing
  const HOLD = 3800, FADE = 2200;
  const lit = new Map();                         // edge key -> { a, b, t }
  let dots = null, dpr = 1, raf = 0;

  const colour = () => (getComputedStyle(document.documentElement).getPropertyValue("--gc").trim() || "79,224,200");
  const centre = (col, row) => [W * (col + (row & 1 ? 0.5 : 0)), ROW * row];
  const corner = (c, i) => { const a = (Math.PI / 180) * (60 * i - 30); return [c[0] + L * Math.cos(a), c[1] + L * Math.sin(a)]; };

  function drawDots() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    dots = document.createElement("canvas");
    dots.width = cv.width; dots.height = cv.height;
    const d = dots.getContext("2d");
    d.scale(dpr, dpr);
    const seen = new Set();
    for (let row = -1; row * ROW < innerHeight + L; row++) {
      for (let col = -1; col * W < innerWidth + W; col++) {
        const c = centre(col, row);
        for (let i = 0; i < 6; i++) {
          const p = corner(c, i), key = Math.round(p[0]) + "," + Math.round(p[1]);
          if (seen.has(key)) continue;
          seen.add(key);
          // brighter toward the top right, never gone entirely
          const f = Math.max(0, 1 - Math.hypot(p[0] / innerWidth - 0.85, p[1] / innerHeight) / 1.25);
          d.fillStyle = (i & 1 ? "rgba(79,224,200," : "rgba(154,123,255,") + (0.16 + 0.42 * f).toFixed(3) + ")";
          d.beginPath(); d.arc(p[0], p[1], 1.25, 0, Math.PI * 2); d.fill();
        }
      }
    }
    paint(performance.now());
  }

  // the hexagon edge closest to a point
  function nearestEdge(x, y) {
    let best = null, bd = Infinity;
    const r0 = Math.round(y / ROW);
    for (let row = r0 - 1; row <= r0 + 1; row++) {
      const c0 = Math.round(x / W - (row & 1 ? 0.5 : 0));
      for (let col = c0 - 1; col <= c0 + 1; col++) {
        const c = centre(col, row), d = Math.hypot(x - c[0], y - c[1]);
        if (d < bd) { bd = d; best = c; }
      }
    }
    // edge midpoints of a pointy-top hex sit at 0, 60, 120... degrees
    let ang = Math.atan2(y - best[1], x - best[0]) * 180 / Math.PI;
    const i = ((Math.round(ang / 60) % 6) + 6) % 6;
    const a = corner(best, i), b = corner(best, i + 1);
    return { key: Math.round(a[0] + b[0]) + "," + Math.round(a[1] + b[1]), a, b };
  }

  function light(x, y, now) {
    const e = nearestEdge(x, y);
    const cur = lit.get(e.key);
    if (cur) cur.t = now; else lit.set(e.key, { a: e.a, b: e.b, t: now });
  }

  function paint(now) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, cv.width, cv.height);
    if (dots) g.drawImage(dots, 0, 0);
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const rgb = colour();
    g.lineCap = "round";
    // edges behind the write-up stay much dimmer so the text keeps priority
    const box = document.querySelector(".term");
    const r = box ? box.getBoundingClientRect() : null;
    const behind = document.body.classList.contains("solid-bg") ? 0 : 0.28;
    for (const [k, e] of lit) {
      const age = now - e.t;
      const a = age < HOLD ? 1 : 1 - (age - HOLD) / FADE;
      if (a <= 0) { lit.delete(k); continue; }
      const mx = (e.a[0] + e.b[0]) / 2, my = (e.a[1] + e.b[1]) / 2;
      const inside = r && mx > r.left - 6 && mx < r.right + 6 && my > r.top - 6 && my < r.bottom + 6;
      const s = a * a * (3 - 2 * a) * (inside ? behind : 1);   // ease the fade
      g.shadowColor = `rgba(${rgb},${0.9 * s})`;
      g.shadowBlur = 12;
      g.strokeStyle = `rgba(${rgb},${0.85 * s})`;
      g.lineWidth = 1.6;
      g.beginPath(); g.moveTo(e.a[0], e.a[1]); g.lineTo(e.b[0], e.b[1]); g.stroke();
      g.shadowBlur = 0;
      g.fillStyle = `rgba(255,255,255,${0.7 * s})`;
      for (const p of [e.a, e.b]) { g.beginPath(); g.arc(p[0], p[1], 1.6, 0, Math.PI * 2); g.fill(); }
    }
  }

  addEventListener("scroll", () => { if (!raf && lit.size) raf = requestAnimationFrame(loop); }, { passive: true });
  function loop(now) {
    paint(now);
    raf = lit.size ? requestAnimationFrame(loop) : 0;
  }

  let last = null;
  addEventListener("pointermove", (e) => {
    const now = performance.now(), x = e.clientX, y = e.clientY;
    // fill in the path between events so fast movements leave no gaps
    if (last) {
      const n = Math.min(40, Math.ceil(Math.hypot(x - last[0], y - last[1]) / (L * 0.5)));
      for (let i = 1; i <= n; i++) light(last[0] + (x - last[0]) * i / n, last[1] + (y - last[1]) * i / n, now);
    } else light(x, y, now);
    last = [x, y];
    if (!raf) raf = requestAnimationFrame(loop);
  }, { passive: true });
  document.documentElement.addEventListener("pointerleave", () => { last = null; });
  addEventListener("resize", drawDots);
  drawDots();
})();
</script>
