<script>
(() => {
"use strict";
const root = document.documentElement;
const reduced = root.classList.contains("rm");
const cats = CATVIEW_CATS;
const params = new URLSearchParams(location.search);
const rgb = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16)).join(",");

const view = createCategoryView(document.getElementById("app"), {
  onChange(category, difficulty, k) {
    document.title = `${category} - picoCTF Solves`;
    document.querySelector('link[rel="canonical"]').href = `https://zackcrawford.com${categoryUrl(category)}`;
    history.replaceState(null, "", categoryUrl(category, difficulty));
    // site-wide glows take the category's colour
    root.style.setProperty("--gc", rgb(CATEGORY_COLOR[category]));
    if (cloud) cloud.morphTo(k);
    if (typeof setRail === "function" && railLinks) setRail(k);
  },
  onExit(category) {
    try { sessionStorage.setItem("pico-zoomout", categorySlug(category)); } catch (e) { /* private mode */ }
    location.href = "/picoctf#" + categorySlug(category);
  },
});
/* ---------- navigator: switch categories without leaving ---------- */
const rail = document.getElementById("rail"), railMenu = document.getElementById("rail-menu");
const railAll = document.getElementById("rail-all");
const pad2 = (n) => String(n).padStart(2, "0");
railMenu.innerHTML = cats.map((cat, k) => {
  const all = SOLVES.filter((s) => s.category === cat);
  return `<li><a href="${categoryUrl(cat)}" data-k="${k}" style="--c:${CATEGORY_COLOR[cat]}">
    <span class="n">${pad2(k + 1)}</span><span class="d" aria-hidden="true"></span>
    <span>${escapeHtml(cat)}</span><span class="s">${all.filter(isSolved).length}/${all.length} solved</span></a></li>`;
}).join("");
const railLinks = Array.from(railMenu.querySelectorAll("a"));
function setMenu(open) {
  railMenu.hidden = !open;
  railAll.setAttribute("aria-expanded", String(open));
  if (open) (railMenu.querySelector('[aria-current="true"]') || railLinks[0]).focus();
}
function setRail(k) {
  railLinks.forEach((a, j) => a.setAttribute("aria-current", String(j === k)));
  document.getElementById("rail-count").textContent = `Category ${pad2(k + 1)} of ${pad2(cats.length)}`;
  document.getElementById("rail-name").innerHTML = `<i style="--c:${CATEGORY_COLOR[cats[k]]}"></i>${escapeHtml(cats[k])}`;
  document.getElementById("rail-prev").disabled = k <= 0;
  document.getElementById("rail-next").disabled = k >= cats.length - 1;
}
function go(k) {
  if (k < 0 || k >= cats.length) return;
  view.show(cats[k]);
  window.scrollTo({ top: 0, behavior: "instant" });
}
const curK = () => cats.indexOf(view.category);
document.getElementById("rail-prev").addEventListener("click", () => go(curK() - 1));
document.getElementById("rail-next").addEventListener("click", () => go(curK() + 1));
document.getElementById("rail-top").addEventListener("click", () => window.scrollTo({ top: 0, behavior: "instant" }));
railAll.addEventListener("click", () => setMenu(railMenu.hidden));
railLinks.forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); setMenu(false); go(Number(a.dataset.k)); }));
document.addEventListener("click", (e) => { if (!rail.contains(e.target)) setMenu(false); });
rail.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !railMenu.hidden) { e.stopPropagation(); setMenu(false); railAll.focus(); }
  if (!railMenu.hidden && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
    e.preventDefault();
    const i = railLinks.indexOf(document.activeElement);
    railLinks[(i + (e.key === "ArrowDown" ? 1 : railLinks.length - 1)) % railLinks.length].focus();
  }
});
if (view.category) setRail(curK());

// Keyboard: ArrowLeft/ArrowRight (or PageUp/PageDown) switch category; Home/End jump
// to the first/last. Difficulty tabs keep their own arrow keys when focused.
document.addEventListener("keydown", (e) => {
  if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
  const tag = e.target.tagName;
  // leave keys alone while typing, and let Space/Enter press buttons and links
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(tag) || e.target.isContentEditable) return;
  if (e.key === " " && /^(BUTTON|A|SUMMARY)$/.test(tag)) return;
  if (!railMenu.hidden || document.querySelector(".cmdk:not([hidden])") || !view.category) return;
  const k = curK();
  if (e.key === "ArrowRight" || e.key === "PageDown") { e.preventDefault(); go(k + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(k - 1); }
  else if (e.key === "Home" && e.target === document.body) { e.preventDefault(); go(0); }
  else if (e.key === "End" && e.target === document.body) { e.preventDefault(); go(cats.length - 1); }
  else return;
  document.querySelector(".catview h1")?.setAttribute("tabindex", "-1");
  document.querySelector(".catview h1")?.focus({ preventScroll: true });
});
addEventListener("keydown", (e) => {
  if (e.key === "Escape" && !document.querySelector(".cmdk:not([hidden])") && railMenu.hidden && view.category) {
    document.querySelector(".catview .back-out").click();
  }
});

/* ---------- particles: the category's shape, off to the right ---------- */
// the camera sits inside the category's shape, matching the landing page's dive-in
const INSIDE = 6.5;
const state = { time: 0, x: 0, y: 0, scale: INSIDE, dim: 1, mouseX: 0, mouseY: 0 };
let cloud = null;
view.show(params.get("c") || "", params.get("d"));
try {
  if (sessionStorage.getItem("pico-from-solve") === "1") {
    sessionStorage.removeItem("pico-from-solve");
    document.body.classList.add("from-solve");
    // with page morphing the card already flew back into place; otherwise zoom the page in
    if (!("CSSViewTransitionRule" in window)) document.querySelector(".page .inner").classList.add("back-in");
    else document.querySelector(".page .inner").style.animation = "none";
  }
} catch (e) { /* private mode */ }
const category = view.category;

addEventListener("pointermove", (e) => {
  state.mouseX = (e.clientX / innerWidth) * 2 - 1;
  state.mouseY = (e.clientY / innerHeight) * 2 - 1;
  if (e.pointerType !== "touch") { state.pointerX = state.mouseX; state.pointerY = -state.mouseY; }
}, { passive: true });
document.documentElement.addEventListener("pointerleave", () => { state.pointerX = state.pointerY = undefined; });

if (!reduced && category) {
  const startParticles = () => import("/picoctf/js/particles.js?v=20261108v")
    .then((m) => m.createParticles(document.getElementById("scene"), {
      shapes: cats.map((x) => CATEGORY_SHAPE[x] || "core"),
      tints: cats.map((x) => CATEGORY_COLOR[x]),
      start: cats.indexOf(category),
      initial: { scale: INSIDE, dim: 1 },
      backdrop: true,
    }))
    .then((c) => { cloud = c; document.getElementById("scene").classList.add("is-ready"); })
    .catch((err) => { console.warn("Particles unavailable.", err); root.classList.add("no-gl"); });
  // build the scene once the page has arrived, then fade it in
  setTimeout(() => requestAnimationFrame(startParticles), 650);
  const touch = matchMedia("(pointer: coarse)").matches;
  let lastW = innerWidth, lastH = innerHeight;
  addEventListener("resize", () => {
    if (touch && innerWidth === lastW && Math.abs(innerHeight - lastH) < 160) return;
    lastW = innerWidth; lastH = innerHeight;
    if (cloud) cloud.resize();
  });
  const frame = (ms) => {
    state.time = ms / 1000;
    // slowly turn the surrounding shape
    state.spin = state.time * 0.05;
    state.dim = innerWidth < 720 ? 0.75 : 1;
    if (cloud) cloud.update(state);
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
})();
</script>
