<style>
:root{
  /* colours come from css/liner.css */
  --r:3px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",system-ui,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:2px}
.wrap{max-width:1680px;margin:0 auto;padding:0 28px}

/* masthead */
.masthead{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.masthead-inner{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:60px}
.mast-tools{justify-self:end;display:flex;align-items:center;gap:18px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:50%;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .28s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:hover{background:var(--haze);border-color:var(--violet);transform:scale(1.18) rotate(-4deg)}
.icon-btn:active{transform:scale(.85)}
.icon-btn svg{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:hover svg{transform:scale(1.25)}
.icon-btn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.6}

/* title */
.head{padding:34px 0 18px;text-align:center}
.head h1{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 82;font-weight:800;font-size:clamp(30px,4.2vw,46px);letter-spacing:-.03em;margin:0 0 6px;line-height:1}

/* controls */
.controls{position:sticky;top:60px;z-index:20;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 0 16px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.row + .row{margin-top:11px}
.lbl{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.field{background:var(--haze);border:1px solid var(--line);border-radius:3px;padding:8px 11px;font-size:14px;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.3)}
.field:hover{border-color:var(--violet)}
#q{min-width:230px;cursor:text}
#q::placeholder{color:var(--muted)}
.chip{padding:6px 13px;border:1px solid var(--line);border-radius:3px;background:var(--haze);font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;transition:all .16s ease}
.chip:hover{border-color:var(--violet);color:var(--ink)}
.chip:active{transform:scale(.94)}
.chip[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--on-accent);font-weight:600}
.chip .n{opacity:.65;font-size:11.5px;margin-left:5px}
.clear{background:var(--haze);border:1px solid var(--line);border-radius:3px;padding:8px 14px;box-shadow:0 2px 10px rgba(0,0,0,.3);
  font-size:14px;color:var(--muted);cursor:pointer;transition:border-color .16s ease,color .16s ease,transform .28s cubic-bezier(.34,1.56,.64,1)}
.clear:hover{border-color:var(--violet);color:var(--ink)}
.clear:active{transform:scale(.95)}

/* results */
.summary{padding:16px 0 12px;font-size:13.5px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:26px 20px;padding-bottom:64px}
.card{display:flex;flex-direction:column;height:100%;opacity:0;transform:translateY(18px);transition:opacity .5s ease .15s,transform .5s ease .15s}
.card.in-view{opacity:1;transform:none}
.card.no-anim{transition:none!important}
.card:hover .cover{transform:translateY(-3px)}
.card:hover .t{color:var(--violet-deep)}
.cover{aspect-ratio:1;border:1px solid var(--line);border-radius:0;overflow:hidden;background:transparent;transition:transform .1s ease-out,border-color .2s ease;position:relative;transform-style:preserve-3d;will-change:transform}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.meter{height:3px;background:var(--line);border-radius:2px;margin:10px 0 9px;overflow:hidden}
.meter b{display:block;height:100%;border-radius:2px}
.g{font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--violet-deep);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Album title leads - it's what you're scanning for. Clamped to two lines and
   given that height even when it's one, so every score pill sits on the same
   baseline across the row. */
.t{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 84;
   font-weight:700;font-size:15px;line-height:1.25;color:var(--ink);margin:0 0 2px;
   display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
   overflow:hidden;min-height:2.5em;transition:color .16s ease}
.a{font-family:"Newsreader",serif;font-style:italic;font-size:14.5px;line-height:1.3;
   color:var(--muted);margin:0;
   display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
/* margin-top:auto pins the footer to the bottom of every card */
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:9px}
.yr{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:70px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:3px;background:var(--haze)}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px;font-family:"Bricolage Grotesque",sans-serif}

@media (max-width:640px){
  .wrap{padding:0 16px}
  .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr));gap:20px 14px}
  .controls{position:static}
  #q{min-width:0;flex:1}
}

/* ---------- motion ---------- */
/* Page-to-page navigation (cross-document View Transitions). Supported in
   Chromium and Safari 18.2+; other browsers just navigate with no animation
   and no error - this is progressive enhancement, not a requirement. */
@view-transition{navigation:auto}
::view-transition-old(root){animation:page-out .18s ease both}
::view-transition-new(root){animation:page-in .26s ease both}
@keyframes page-out{to{opacity:0}}
@keyframes page-in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* shared masthead: ZC coin home link + site nav (identical on all five album pages) */
.brand-coin{grid-column:2;justify-self:center;display:grid;place-items:center;width:38px;height:38px;color:var(--ink);border-radius:50%;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.brand-coin svg{width:100%;height:100%}
.brand-coin:hover{transform:rotate(-14deg) scale(1.08)}
.mast-tools{grid-column:3;justify-self:end;display:flex;align-items:center;gap:22px}
.nav-link{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--muted);padding:6px 0;transition:color .18s ease}
.nav-link:hover{color:var(--ink)}
.nav-link svg{display:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav-link[aria-current="page"]{color:var(--violet-deep)}
.nav-link[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--violet)}
@media (max-width:720px){
  .masthead-inner{grid-template-columns:auto 1fr;gap:12px}
  .brand-coin{grid-column:1;justify-self:start;width:34px;height:34px}
  .mast-tools{grid-column:2}
  .mast-tools{gap:6px}
  .nav-link{width:34px;height:34px;justify-content:center;padding:0;border:1px solid var(--line);border-radius:50%}
  .nav-link span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .nav-link svg{display:block}
  .nav-link[aria-current="page"]{border-color:var(--violet);background:var(--haze)}
  .nav-link[aria-current="page"]::after{display:none}
}
</style>

        <path d="M20 21h18L20 43h18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="miter"/>

<div class="wrap head">
  <h1>Album Reviews</h1>
</div>

<div class="controls">
  <div class="wrap">
    <div class="row">
      <input type="text" id="q" class="field" placeholder="Filter by album or artist…" autocomplete="off">
      <span class="lbl">Sort</span>
      <select id="sort" class="field">
        <option value="az">Album A–Z</option>
        <option value="za">Album Z–A</option>

<script src="/albums/js/score.js"></script>
<script src="/albums/data/reviews-data.js"></script>
<script src="/albums/js/search.js" defer></script>
<script>
(function () {
  var ALL = (typeof REVIEWS !== "undefined") ? REVIEWS : [];
  var tabsOf = function (r) { return r.tabs || (r.tab ? [r.tab] : []); };
  var el = function (id) { return document.getElementById(id); };

  var state = { q: "", sort: "az", genres: [], min: 0, max: null, best: false, decade: "" };

  function norm(s) { return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, ""); }
  function yearOf(r) { var m = String(r.year || "").match(/\d{4}/); return m ? +m[0] : 0; }

  // ---- build the genre chips and decade list from the data itself ----
  var counts = {};
  ALL.forEach(function (r) {
    tabsOf(r).forEach(function (t) { counts[t] = (counts[t] || 0) + 1; });
  });
  Object.keys(counts).sort().forEach(function (g) {
    var b = document.createElement("button");
    b.className = "chip"; b.type = "button"; b.dataset.genre = g;
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = g + '<span class="n">' + counts[g] + "</span>";
    el("genres").appendChild(b);
  });

  // Current year first, then every decade present in the data. The year option
  // is always offered even with nothing in it yet, so a new release is one click
  // away the moment it's reviewed.
  var thisYear = new Date().getFullYear();
  var yOpt = document.createElement("option");
  yOpt.value = "y" + thisYear;
  yOpt.textContent = thisYear + " (this year)";
  el("decade").appendChild(yOpt);

  var decades = {};
  ALL.forEach(function (r) { var y = yearOf(r); if (y) decades[Math.floor(y / 10) * 10] = 1; });
  Object.keys(decades).sort(function (a, b) { return b - a; }).forEach(function (d) {
    var o = document.createElement("option");
    o.value = d; o.textContent = d + "s";
    el("decade").appendChild(o);
  });

  // ---- filter + sort ----
  function apply() {
    var out = ALL.filter(function (r) {
      if (state.genres.length &&
          !state.genres.some(function (g) { return tabsOf(r).indexOf(g) !== -1; })) return false;
      if (state.min && !(r.finalScore >= state.min)) return false;
      if (state.max != null && !(r.finalScore < state.max)) return false;
      if (state.best && !(r.finalScore >= 8.5 && yearOf(r) === thisYear)) return false;
      if (state.decade) {
        var y = yearOf(r);
        if (!y) return false;
        if (state.decade.charAt(0) === "y") {          // a single year
          if (y !== +state.decade.slice(1)) return false;
        } else if (y < +state.decade || y > +state.decade + 9) return false;
      }
      if (state.q) {
        var q = norm(state.q);
        if (norm(r.title).indexOf(q) === -1 && norm(r.artist).indexOf(q) === -1) return false;
      }
      return true;
    });

    var by = {
      az:   function (a, b) { return a.title.localeCompare(b.title); },
      za:   function (a, b) { return b.title.localeCompare(a.title); },
      artist: function (a, b) { return (a.artist || "").localeCompare(b.artist || "")
                                      || a.title.localeCompare(b.title); },
      recent: function (a, b) { return String(b.reviewed || "").localeCompare(String(a.reviewed || "")); },
      "oldest-reviewed": function (a, b) { return String(a.reviewed || "").localeCompare(String(b.reviewed || "")); },
      newest: function (a, b) { return yearOf(b) - yearOf(a) || a.title.localeCompare(b.title); },
      oldest: function (a, b) { return yearOf(a) - yearOf(b) || a.title.localeCompare(b.title); },
      high:   function (a, b) { return b.finalScore - a.finalScore || a.title.localeCompare(b.title); },
      low:    function (a, b) { return a.finalScore - b.finalScore || a.title.localeCompare(b.title); }
    };
    out.sort(by[state.sort] || by.az);
    return out;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function card(r) {
    var cls = window.scoreClass(r.finalScore);
    return '<a class="card" href="/albums/review/' + encodeURIComponent(r.slug) + '">' +
      '<div class="cover"><img src="/albums/covers/' + encodeURIComponent(r.slug) + '.jpg" alt=""' +
      ' loading="lazy" onerror="this.remove()"></div>' +
      '<div class="meter sc-bar ' + cls + '"><b style="width:' +
      Math.min(r.finalScore * 10, 100) + '%"></b></div>' +
      '<p class="g">' + esc(tabsOf(r).slice(0, 2).join(" · ")) + '</p>' +
      '<p class="t">' + esc(r.title) + '</p>' +
      '<p class="a">' + esc(r.artist) + '</p>' +
      '<div class="foot"><span class="yr">' + esc(r.year) + '</span>' +
      '<span class="sc-pill ' + cls + '">' +
      (r.finalScore != null ? r.finalScore.toFixed(1) : "—") + '</span></div>' +
      '</a>';
  }

  // Cards rise in once, the first time they scroll into view, then stay put.
  // Albums already seen (filters redraw the grid) and cards above the screen
  // (Back restores the scroll position) appear immediately.
  var seenCards = new Set();
  function showCard(card, animate) {
    if (!animate) card.classList.add("no-anim");
    card.classList.add("in-view");
    seenCards.add(card.getAttribute("href"));
    revealObserver.unobserve(card);
  }
  var revealObserver = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting) showCard(entry.target, true);
      else if (entry.boundingClientRect.bottom < 0) showCard(entry.target, false);
    });
  }, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });

  function render() {
    var list = apply();
    el("grid").innerHTML = list.length
      ? list.map(card).join("")
      : '<div class="empty" style="grid-column:1/-1"><b>No matches</b></div>';
    document.querySelectorAll(".card").forEach(function (c) {
      if (seenCards.has(c.getAttribute("href"))) showCard(c, false); else revealObserver.observe(c);
    });

    var bits = [];
    if (state.genres.length) bits.push(state.genres.join(", "));
    if (state.min) bits.push(state.min + "+");
    if (state.max != null) bits.push("under " + state.max);
    if (state.best) bits.push("best new album");
    if (state.decade) {
      bits.push(state.decade.charAt(0) === "y" ? state.decade.slice(1) : state.decade + "s");
    }
    if (state.q) bits.push('matching "' + state.q + '"');
    el("summary").textContent = list.length + " of " + ALL.length + " review" +
      (ALL.length === 1 ? "" : "s") + (bits.length ? " — " + bits.join(" · ") : "");
  }

  // ---- wiring ----
  el("q").addEventListener("input", function () { state.q = this.value; render(); });
  el("sort").addEventListener("change", function () { state.sort = this.value; render(); });
  el("decade").addEventListener("change", function () { state.decade = this.value; render(); });

  el("genres").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    var g = b.dataset.genre, i = state.genres.indexOf(g);
    i === -1 ? state.genres.push(g) : state.genres.splice(i, 1);
    b.setAttribute("aria-pressed", i === -1 ? "true" : "false");
    render();
  });

  el("scores").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b) return;
    [].forEach.call(el("scores").querySelectorAll(".chip"), function (c) {
      c.setAttribute("aria-pressed", c === b ? "true" : "false");
    });
    state.min = +(b.dataset.min || 0);
    state.max = b.dataset.max ? +b.dataset.max : null;
    state.best = b.dataset.best === "1";
    render();
  });

  el("clear").addEventListener("click", function () {
    state = { q: "", sort: "az", genres: [], min: 0, max: null, best: false, decade: "" };
    el("q").value = ""; el("sort").value = "az"; el("decade").value = "";
    [].forEach.call(document.querySelectorAll("#genres .chip"),
      function (c) { c.setAttribute("aria-pressed", "false"); });
    [].forEach.call(el("scores").querySelectorAll(".chip"), function (c, i) {
      c.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    });
    render();
  });

  el("random").addEventListener("click", function () {
    if (!ALL.length) return;
    var pick = ALL[Math.floor(Math.random() * ALL.length)];
    location.href = "/albums/review/" + encodeURIComponent(pick.slug);
  });

  // arriving from a genre tab keeps that filter on
  var wanted = new URLSearchParams(location.search).get("genre");
  var saved = history.state && history.state.browse;
  if (saved) {
    // coming Back from a review: put every filter back the way it was
    state = saved;
    el("q").value = state.q; el("sort").value = state.sort; el("decade").value = state.decade;
    [].forEach.call(document.querySelectorAll("#genres .chip"), function (c) {
      c.setAttribute("aria-pressed", state.genres.indexOf(c.dataset.genre) !== -1 ? "true" : "false");
    });
    [].forEach.call(el("scores").querySelectorAll(".chip"), function (c) {
      var on = +(c.dataset.min || 0) === state.min &&
        (c.dataset.max ? +c.dataset.max : null) === state.max &&
        (c.dataset.best === "1") === state.best;
      c.setAttribute("aria-pressed", on ? "true" : "false");
    });
  } else if (wanted) {
    var chip = document.querySelector('#genres .chip[data-genre="' + wanted + '"]');
    if (chip) { state.genres = [wanted]; chip.setAttribute("aria-pressed", "true"); }
  }

  // every re-render saves the filters into this page's history entry, so Back
  // from a review returns to the same filtered list (not browser storage)
  var drawList = render;
  render = function () {
    drawList();
    // (Safari throttles very rapid history writes while typing; losing one is harmless)
    try { history.replaceState(Object.assign({}, history.state, { browse: state }), "", location.href); } catch (e) {}
  };
  render();
})();

// ---- cover tilt: cursor-driven 3D tilt on album art, delegated so it keeps
// working after apply() re-renders the grid on sort/filter changes ----
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var DEG = 10;
  var activeCover = null;

  function applyTilt(cover, e) {
    var r = cover.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width - 0.5;
    var py = (e.clientY - r.top) / r.height - 0.5;
    cover.style.transform =
      "perspective(700px) rotateX(" + (-py * DEG).toFixed(2) + "deg) " +
      "rotateY(" + (px * DEG).toFixed(2) + "deg) translateY(-3px) scale(1.02)";
  }

  document.addEventListener("mousemove", function (e) {
    var cover = e.target.closest(".cover");
    if (cover !== activeCover && activeCover) activeCover.style.transform = "";
    activeCover = cover;
    if (cover) applyTilt(cover, e);
  });
  document.addEventListener("mouseleave", function () {
    if (activeCover) activeCover.style.transform = "";
    activeCover = null;
  });
})();
</script>

</body>
