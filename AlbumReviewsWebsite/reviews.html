<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style>html{background:#0e0e0d}
/* already-seen cards appear without replaying the rise-in */
.card.no-anim,.card.no-anim *{transition:none!important}
</style>
<title>Album reviews</title>
<meta name="description" content="Album reviews by Zack Crawford: scored write-ups of hip-hop, pop, and rock records, with search, stats, and an RSS feed.">
<link rel="icon" href="/MainPortfolioPage/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://zackcrawford.com/albums">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zack Crawford">
<meta property="og:title" content="Album Reviews - Zack Crawford">
<meta property="og:description" content="Album reviews by Zack Crawford: scored write-ups of hip-hop, pop, and rock records, with search, stats, and an RSS feed.">
<meta property="og:url" content="https://zackcrawford.com/albums">
<meta property="og:image" content="https://zackcrawford.com/MainPortfolioPage/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Zack Crawford, cybersecurity portfolio">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="Ridez — Album Reviews" href="/albums/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
:root{
  /* colours come from css/liner.css */
  --wrap:1180px;
  --r:3px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;display:flex;flex-direction:column;
  background:var(--paper);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- masthead ---------- */
.masthead{
  position:sticky;top:0;z-index:20;
  background:var(--paper);

  border-bottom:1px solid var(--line);
}
.masthead-inner{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:60px}
.mast-tools{justify-self:end;display:flex;align-items:center;gap:10px}
.icon-btn{
  width:34px;height:34px;display:grid;place-items:center;
  background:none;border:1px solid var(--line);border-radius:50%;cursor:pointer;
  transition:background .18s ease,border-color .18s ease,transform .28s cubic-bezier(.34,1.56,.64,1);
}
.icon-btn:hover{background:var(--haze);border-color:var(--violet);transform:scale(1.18) rotate(-4deg)}
.icon-btn:active{transform:scale(.85)}
.icon-btn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.6;transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:hover svg{transform:scale(1.25)}

/* ---------- title band ---------- */
.band{border-bottom:1px solid var(--line)}
.band-inner{padding:44px 0 0;text-align:center}
.band h1{
  font-family:"Bricolage Grotesque",sans-serif;
  font-variation-settings:"wdth" 80;
  font-weight:800;
  font-size:clamp(38px,6.4vw,68px);
  line-height:.95;
  letter-spacing:-.035em;
  margin:0 0 12px;
}
.band p{max-width:44ch;margin:0 auto 26px;color:var(--muted);font-size:15px}

/* ---------- genre tabs ---------- */
.tabs{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding-bottom:18px;position:relative}
.tabs::-webkit-scrollbar{display:none}
.tab-indicator{
  position:absolute;top:0;left:0;z-index:0;pointer-events:none;
  background:var(--ink);border-radius:3px;opacity:0;

  transition:transform .32s cubic-bezier(.4,0,.2,1),width .32s cubic-bezier(.4,0,.2,1),
             height .32s cubic-bezier(.4,0,.2,1),opacity .2s ease;
}
.tab{
  position:relative;z-index:1;
  flex:0 0 auto;
  padding:8px 16px;
  border:1px solid var(--line);
  border-radius:3px;
  background:var(--paper);
  font-size:14px;font-weight:500;color:var(--muted);
  cursor:pointer;white-space:nowrap;
  transition:background .18s ease,color .18s ease,border-color .18s ease,transform .28s cubic-bezier(.34,1.56,.64,1);
}
.tab:active{transform:scale(.94)}
.tab:hover{border-color:var(--violet);color:var(--violet)}
.tab.empty{opacity:.45}
.tab.empty:hover{border-color:var(--line);color:var(--muted)}
.empty-state{border:1px dashed var(--line);border-radius:3px;padding:52px 24px;text-align:center;background:var(--haze)}
.empty-state h3{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 84;font-weight:700;font-size:19px;margin:0 0 8px}
.empty-state p{color:var(--muted);font-size:14.5px;margin:0 0 18px;max-width:42ch;margin-left:auto;margin-right:auto}
.empty-state button{padding:10px 22px;border-radius:3px;cursor:pointer;background:transparent;border:1px solid var(--violet);color:var(--violet-deep);font-size:13.5px;font-weight:600}
.empty-state button:hover{background:var(--violet);color:var(--on-accent)}
.tab[aria-selected="true"]{
  background:transparent;border-color:transparent;color:var(--paper);
}

/* ---------- tab content slide (plain CSS - no experimental APIs) ---------- */
#tab-content{transition:transform .22s ease,opacity .22s ease}
#tab-content.tc-out-fwd{transform:translateX(-40px);opacity:0}
#tab-content.tc-out-back{transform:translateX(40px);opacity:0}
#tab-content.tc-in-fwd{transition:none;transform:translateX(40px);opacity:0}
#tab-content.tc-in-back{transition:none;transform:translateX(-40px);opacity:0}

/* ---------- sections ---------- */
.section{padding:40px 0}
.section + .section{padding-top:8px}
.section-head{
  display:flex;align-items:baseline;justify-content:space-between;
  gap:16px;margin-bottom:20px;
  border-bottom:1px solid var(--line);padding-bottom:10px;
}
.section-head h2{
  font-family:"Bricolage Grotesque",sans-serif;
  font-variation-settings:"wdth" 82;
  font-weight:700;font-size:15px;letter-spacing:.09em;text-transform:uppercase;
  margin:0;
}
.section-head .count{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;border-bottom:1px dashed var(--line);cursor:pointer}
.section-head .count:hover{color:var(--violet-deep);border-bottom-color:var(--violet-deep)}

.grid-featured{display:grid;grid-template-columns:repeat(2,1fr);gap:28px}
.grid-latest{display:grid;grid-template-columns:repeat(4,1fr);gap:28px 24px}

/* ---------- review card ---------- */
/* Flex column + margin-top:auto on .meta keeps every score on the same
   baseline across a row, however many lines the album title runs to. */
.card{display:flex;flex-direction:column;position:relative;height:100%}
.card:hover .cover{transform:translateY(-3px)}
.card:hover .title{color:var(--violet)}

.cover{
  position:relative;aspect-ratio:1;overflow:hidden;
  border-radius:0;background:transparent;
  border:1px solid var(--line);
  transition:transform .1s ease-out,border-color .25s ease;
  transform-style:preserve-3d;will-change:transform;
}

.meter{height:3px;background:var(--line);margin:12px 0 12px;border-radius:2px;overflow:hidden}
.meter b{display:block;height:100%;background:var(--violet);border-radius:2px;transition:width .4s ease}

.cover img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.flags{
  position:absolute;top:12px;left:12px;z-index:2;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
}
.flag{
  background:var(--violet);color:var(--on-accent);
  font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;
  padding:5px 10px;border-radius:3px;
}
.genre{
  font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:var(--violet);margin-bottom:5px;
}
.title{
  font-family:"Bricolage Grotesque",sans-serif;
  font-variation-settings:"wdth" 84;
  font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.015em;
  margin:0 0 2px;
  transition:color .18s ease;
}
.artist{
  font-family:"Newsreader",serif;font-style:italic;font-weight:400;
  font-size:19px;line-height:1.25;margin:0 0 8px;
}
.meta{
  display:flex;align-items:center;gap:9px;
  font-size:13px;color:var(--muted);
  margin-top:auto;padding-top:2px;
}
.score{
  font-family:"Newsreader",serif;font-weight:600;font-size:19px;
  color:var(--violet);line-height:1;font-variant-numeric:tabular-nums;
}
.dot{width:3px;height:3px;border-radius:50%;background:var(--line);flex:0 0 auto}

/* Featured: two compact side-by-side cards (cover left, details right), so the
   first row of latest reviews is already on screen when the page opens. */
.grid-featured{gap:24px}
.grid-featured .card{
  display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);column-gap:22px;align-content:start;
  grid-template-areas:"cover genre" "cover title" "cover artist" "cover meta" "cover meter" "cover ." ;
  grid-template-rows:auto auto auto auto auto 1fr;
}
.grid-featured .cover{grid-area:cover}
.grid-featured .genre{grid-area:genre;margin-top:6px}
.grid-featured .title{grid-area:title;font-size:22px}
.grid-featured .artist{grid-area:artist;font-size:21px}
.grid-featured .meta{grid-area:meta;margin-top:6px}
.grid-featured .meter{grid-area:meter;margin:14px 0 0}
.grid-featured .score{font-size:24px}
.grid-featured .flags{top:8px;left:8px}
.grid-latest{grid-template-columns:repeat(5,1fr);gap:28px 20px}

/* ---------- on deck ----------
   One slim bar: label, count, search, "See all". Results open in a small
   scrolling panel underneath, so the queue never takes over the page. */
.ondeck{border-top:1px solid var(--line);padding:22px 0 40px}
.od-bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.od-bar h2{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 82;font-weight:700;
  font-size:13px;letter-spacing:.11em;text-transform:uppercase;margin:0}
.od-count{font-size:13px;color:var(--muted)}
.od-search{position:relative;flex:1 1 260px;max-width:380px;margin-left:auto}
.od-search input{width:100%;height:36px;padding:0 36px 0 12px;font:inherit;font-size:14px;color:var(--ink);
  background:var(--haze);border:1px solid var(--line);border-radius:3px;outline:none}
.od-search input:focus{border-color:var(--violet)}
.od-search input::placeholder{color:var(--muted)}
.od-search input::-webkit-search-cancel-button{display:none}
.od-throbber{position:absolute;right:11px;top:50%;width:15px;height:15px;margin-top:-7.5px;border-radius:50%;
  border:2px solid var(--line);border-top-color:var(--violet);animation:od-spin .7s linear infinite}
.od-throbber[hidden]{display:none}
@keyframes od-spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.od-throbber{animation:od-pulse 1s ease-in-out infinite alternate!important}}
@keyframes od-pulse{from{opacity:.35}to{opacity:1}}
.od-all{height:36px;padding:0 14px;font:inherit;font-size:13px;color:var(--muted);background:none;
  border:1px solid var(--line);border-radius:3px;cursor:pointer}
.od-all:hover,.od-all[aria-expanded="true"]{color:var(--ink);border-color:var(--violet)}
.od-panel{margin-top:12px;border:1px solid var(--line);border-radius:3px;background:var(--haze);max-height:264px;overflow-y:auto}
.od-panel[hidden]{display:none}
.od-list{list-style:none;margin:0;padding:4px 0}
.od-list li{display:flex;align-items:baseline;gap:10px;padding:7px 14px;font-size:14px}
.od-list li + li{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.od-list b{font-weight:600;color:var(--ink)}
.od-list span{color:var(--muted);font-size:13px}
.od-list .yr{margin-left:auto;font-variant-numeric:tabular-nums}
.od-list mark{background:none;color:var(--violet-deep)}
.od-msg{padding:14px;font-size:14px;color:var(--muted)}
.od-msg a{color:var(--violet-deep);text-decoration:underline;text-underline-offset:3px}
.od-note{padding:8px 14px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
@media (max-width:720px){.od-search{flex-basis:100%;max-width:none;margin-left:0;order:3}}

/* ---------- footer / load more ---------- */
.more{display:flex;justify-content:center;padding:16px 0 64px}
.more button{
  padding:13px 34px;border-radius:3px;cursor:pointer;
  background:var(--paper);border:1px solid var(--violet);color:var(--violet);
  font-size:14px;font-weight:600;letter-spacing:.02em;
  transition:background .18s ease,color .18s ease,transform .28s cubic-bezier(.34,1.56,.64,1);
}
.more button:hover{background:var(--violet);color:var(--on-accent)}
.more button:active{transform:scale(.96)}
footer{border-top:1px solid var(--line);padding:30px 0;font-size:13px;color:var(--muted);margin-top:auto}
.foot-inner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.foot-link{color:var(--violet-deep);font-weight:600}
.foot-link:hover{text-decoration:underline}
.foot-home{color:inherit;text-decoration:none}
.foot-home:hover{color:var(--violet-deep)}

/* ---------- motion ---------- */
.card{opacity:0;transform:translateY(18px);transition:opacity .5s ease .15s,transform .5s ease .15s}
.card.in-view{opacity:1;transform:none}

/* Page-to-page navigation (cross-document View Transitions). Supported in
   Chromium and Safari 18.2+; other browsers just navigate with no animation
   and no error - this is progressive enhancement, not a requirement. */
@view-transition{navigation:auto}
::view-transition-old(root){animation:page-out .18s ease both}
::view-transition-new(root){animation:page-in .26s ease both}
@keyframes page-out{to{opacity:0}}
@keyframes page-in{from{opacity:0;transform:translateY(10px)}}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---------- responsive ---------- */
@media (max-width:960px){
  .grid-featured{grid-template-columns:1fr}
  .grid-featured .card{grid-template-columns:240px minmax(0,1fr)}
  .grid-latest{grid-template-columns:repeat(3,1fr)}
}
@media (max-width:720px){
  .band-inner{padding-top:32px}
  .grid-featured{grid-template-columns:1fr;gap:18px}
  .grid-featured .card{grid-template-columns:120px minmax(0,1fr);column-gap:14px}
  .grid-featured .flags{display:none}
  .grid-latest{grid-template-columns:repeat(2,1fr);gap:24px 16px}
  .grid-featured .title{font-size:18px}
  .grid-featured .artist{font-size:17px}
  .grid-featured .score{font-size:20px}
  .wrap{padding:0 16px}
}

/* shared masthead: ZC coin home link + site nav (identical on all five album pages) */
.brand-coin{grid-column:2;justify-self:center;display:grid;place-items:center;width:38px;height:38px;color:var(--ink);border-radius:50%;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.brand-coin svg{width:100%;height:100%}
.brand-coin:hover{transform:rotate(-14deg) scale(1.08)}
.mast-tools{grid-column:3;justify-self:end;display:flex;align-items:center;gap:22px}
.nav-link{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--muted);padding:6px 0;transition:color .18s ease}
.nav-link:hover{color:var(--ink)}
.nav-link svg{display:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav-link[aria-current="page"]{color:var(--violet-deep)}
.nav-link[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--violet)}
@media (max-width:720px){
  .masthead-inner{grid-template-columns:auto 1fr;gap:12px}
  .brand-coin{grid-column:1;justify-self:start;width:34px;height:34px}
  .mast-tools{grid-column:2}
  .mast-tools{gap:6px}
  .nav-link{width:34px;height:34px;justify-content:center;padding:0;border:1px solid var(--line);border-radius:50%}
  .nav-link span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .nav-link svg{display:block}
  .nav-link[aria-current="page"]{border-color:var(--violet);background:var(--haze)}
  .nav-link[aria-current="page"]::after{display:none}
}
</style>
<link rel="stylesheet" href="/albums/css/liner.css">
</head>
<body>

<header class="masthead">
  <div class="wrap masthead-inner">
    <a href="/" class="brand-coin" aria-label="Zack Crawford, back to the portfolio home page" title="Back to portfolio">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#4fe0c8" stroke-width="2"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="#9a7bff" stroke-width="1" stroke-dasharray="2 3"/>
        <path d="M20 21h18L20 43h18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="miter"/>
        <path d="M47 24a9 9 0 1 0 0 16" fill="none" stroke="#ff6b7d" stroke-width="3.2"/>
      </svg>
    </a>
    <nav class="mast-tools" aria-label="Album reviews">
      <a class="nav-link" href="/albums" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Reviews</span></a>
      <a class="nav-link" href="/albums/all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Browse</span></a>
      <a class="nav-link" href="/albums/stats"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></a>
      <a class="nav-link" href="/albums/subscribe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 6l8 7 8-7"/></svg><span>Subscribe</span></a>
      <button class="icon-btn" aria-label="Search" data-search-toggle>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </nav>
  </div>
</header>

<div class="band">
  <div class="wrap band-inner">
    <h1>Album Reviews</h1>
    <div class="tabs" id="tabs" role="tablist" aria-label="Filter reviews by genre"></div>
  </div>
</div>

<main class="wrap">
  <div id="tab-content">
    <section class="section" id="feat-section" aria-labelledby="feat-h">
      <div class="section-head">
        <h2 id="feat-h">Featured</h2>
      </div>
      <div class="grid-featured" id="featured"></div>
    </section>

    <div id="empty"></div>

    <section class="section" aria-labelledby="latest-h">
      <div class="section-head" id="latest-head">
        <h2 id="latest-h">Latest reviews</h2>
        <a class="count" id="count" href="/albums/all"></a>
      </div>
      <div class="grid-latest" id="latest"></div>
    </section>

    <div class="more"><button type="button" id="more">More</button></div>
  </div>

  <section class="ondeck" id="ondeck" hidden aria-labelledby="ondeck-h">
    <div class="od-bar">
      <h2 id="ondeck-h">On deck</h2>
      <span class="od-count" id="ondeck-count"></span>
      <div class="od-search" role="search">
        <label class="sr" for="od-q">Search albums on deck</label>
        <input type="search" id="od-q" placeholder="Search the list" autocomplete="off" spellcheck="false" aria-controls="od-panel">
        <span class="od-throbber" id="od-throbber" hidden aria-hidden="true"></span>
      </div>
      <button type="button" class="od-all" id="od-all" aria-expanded="false" aria-controls="od-panel">See all</button>
    </div>
    <div class="od-panel" id="od-panel" hidden aria-live="polite"></div>
  </section>
</main>

<footer>
  <div class="wrap foot-inner">
    <a href="/" class="foot-home">Portfolio</a>
    <a href="https://www.albumoftheyear.org/user/ridez/" target="_blank" rel="noopener" class="foot-link">AlbumOfTheYear account</a>
  </div>
</footer>

<script src="/albums/js/score.js"></script>
<script src="/albums/data/queue.js"></script>
<script src="/albums/js/ondeck-search.js"></script>
<script src="/albums/data/reviews-data.js"></script>
<script src="/albums/js/search.js" defer></script>
<script>
const TABS = ["All","Rock","Alternative","Hip-hop","Electronic","Pop","R&B","Jazz","Metal","Folk","Country","Experimental"];
const PER_PAGE = 10, FEATURED = 2;
// latest reviews always fill whole rows, whatever the column count
const latestCols = () => Math.max(1, getComputedStyle(document.getElementById("latest")).gridTemplateColumns.split(" ").length);
const fullRows = n => Math.ceil(n / latestCols()) * latestCols();


// Covers are optional. Try .jpg, then a few other extensions, then give up and
// leave the outlined placeholder box showing.
function coverFallback(img){
  const left = (img.dataset.tries || "").split(",").filter(Boolean);
  if (!left.length) { img.remove(); return; }
  const next = left.shift();
  img.dataset.tries = left.join(",");
  img.src = img.src.replace(/\.[a-z0-9]+$/i, "." + next);
}

const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

const ALL = (typeof REVIEWS !== "undefined") ? REVIEWS : [];

const THIS_YEAR = new Date().getFullYear();
const yearOf = r => { const m = String(r.year || "").match(/\d{4}/); return m ? +m[0] : 0; };

// A single winner, site-wide - whichever review has the newest `reviewed`
// date wins ties by array order (reviews.sort() in the parser is by artist,
// so that's deterministic, if arbitrary when several share a day).
const mostRecentSlug = ALL.reduce(
  (best, r) => (!best || r.reviewed > best.reviewed) ? r : best, null
)?.slug;

// An album can sit in several genres at once, so match against the whole list.
// (Older data files only had a single `tab` - fall back to it.)
const tabsOf = r => r.tabs || (r.tab ? [r.tab] : []);
const inTab  = (r, g) => g === "All" || tabsOf(r).includes(g);
const countIn = g => ALL.filter(r => inTab(r, g)).length;

// every tab is always shown, even with nothing behind it yet.
// "Other" only appears if something actually landed there.
const GENRES = TABS.concat(ALL.some(r => tabsOf(r).includes("Other")) ? ["Other"] : []);

// ?genre=Jazz opens the page on that tab (used by the genre link on a review page)
const wanted = new URLSearchParams(location.search).get("genre");
let active = GENRES.find(g => g.toLowerCase() === (wanted || "").toLowerCase()) || "All";
// "Load more" progress lives in this page's history entry, so coming Back from
// a review shows the same reviews (and the browser can restore the scroll spot).
let visible = (history.state && history.state.visible) || PER_PAGE;
const rememberVisible = () => { try { history.replaceState(Object.assign({}, history.state, { visible }), "", location.href); } catch (e) {} };
const el = id => document.getElementById(id);

// On a filtered tab, lead with that genre; otherwise show them in priority order.
function genreLabel(a){
  const t = tabsOf(a);
  const ordered = active !== "All" && t.includes(active)
    ? [active, ...t.filter(x => x !== active)]
    : t;
  return ordered.slice(0, 3).join(" · ");
}

function flagsFor(a){
  const flags = [];
  if (a.finalScore >= 9.0) flags.push("Top-rated");
  if (yearOf(a) === THIS_YEAR && a.finalScore >= 8.5) flags.push("Best new");
  if (a.slug === mostRecentSlug) flags.push("Most recent review");
  return flags;
}

function cardHTML(a){
  const flags = flagsFor(a);
  return `<a class="card" href="/albums/review/${encodeURIComponent(a.slug)}">
    <div class="cover">${flags.length ? `<div class="flags">${flags.map(f => `<span class="flag">${f}</span>`).join("")}</div>` : ""}<img
      src="/albums/covers/${encodeURIComponent(a.slug)}.jpg" alt="" loading="lazy"
      data-tries="png,jpeg,webp" onerror="coverFallback(this)"></div>
    <div class="meter sc-bar ${window.scoreClass(a.finalScore)}"><b style="width:${Math.min(a.finalScore*10,100)}%"></b></div>
    <p class="genre">${esc(genreLabel(a))}</p>
    <h3 class="title">${esc(a.title)}</h3>
    <p class="artist">${esc(a.artist)}</p>
    <div class="meta">
      <span class="score sc-text ${window.scoreClass(a.finalScore)}" data-count-to="${a.finalScore}">0.0</span>
      <span class="dot"></span>
      <span>${esc(a.year)}</span>
    </div>
  </a>`;
}

// Score count-up, run once when a card first scrolls into view (see showCard).
function animateScore(scoreEl){
  const target = parseFloat(scoreEl.dataset.countTo);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) {
    scoreEl.textContent = target.toFixed(1);
    return;
  }
  // Starts after the card's own fade/rise (.15s delay + .5s duration) has
  // settled - otherwise the count-up runs its course while the card is still
  // mostly transparent, and by the time it's legible the number's already
  // near its final value.
  setTimeout(() => {
    const start = performance.now(), duration = 650;
    function step(now){
      const p = Math.min((now - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      scoreEl.textContent = (target * eased).toFixed(1);
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }, 550);
}

// Scroll-reveal: cards start hidden (see .card CSS) and fade/rise in once
// they cross into view, and hide again scrolling back past them the other
// way - toggled every time, not a one-shot reveal. Re-run after every
// render() since innerHTML swaps replace the actual card elements each time.
// Cards rise in and count up once, the first time they scroll into view; after
// that they simply stay. Albums already seen (before a genre switch or "Load
// more" redraws the grid) and cards already above the screen (Back restores
// the scroll position) appear immediately, with no animation.
const seenCards = new Set();
function showCard(card, animate){
  const scoreEl = card.querySelector(".score[data-count-to]");
  if (!animate) {
    card.classList.add("no-anim");
    if (scoreEl) scoreEl.textContent = parseFloat(scoreEl.dataset.countTo).toFixed(1);
  } else if (scoreEl) animateScore(scoreEl);
  card.classList.add("in-view");
  seenCards.add(card.getAttribute("href"));
  revealObserver.unobserve(card);
}
const revealObserver = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) showCard(entry.target, true);
    else if (entry.boundingClientRect.bottom < 0) showCard(entry.target, false);
  });
}, { threshold: 0.1, rootMargin: "0px 0px -40px 0px" });

function observeCards(){
  document.querySelectorAll(".card").forEach(c => {
    if (seenCards.has(c.getAttribute("href"))) showCard(c, false);
    else revealObserver.observe(c);
  });
}

function render(){
  const list = ALL.filter(a => inTab(a, active));
  const sorted = [...list].sort((a,b) => b.finalScore - a.finalScore);
  const empty = list.length === 0;

  // nothing reviewed in this genre yet - show a placeholder instead of blank grids
  el("feat-section").style.display = empty ? "none" : "";
  el("latest-head").style.display  = empty ? "none" : "";

  el("empty").innerHTML = empty ? `
    <div class="empty-state">
      <h3>No ${esc(active.toLowerCase())} yet</h3>
      <button type="button" data-goto="All">All reviews</button>
    </div>` : "";

  // Featured takes the highest scores; Latest is everything else in document order.
  // Exclude by identity, not by index - otherwise a top-scoring album that sits
  // further down the list shows twice and another never shows at all.
  const feat = sorted.slice(0, FEATURED);
  const featSlugs = new Set(feat.map(a => a.slug));
  const rest = list.filter(a => !featSlugs.has(a.slug));

  el("featured").innerHTML = feat.map(cardHTML).join("");
  el("latest").innerHTML   = rest.slice(0, fullRows(visible)).map(cardHTML).join("");

  el("count").textContent = `${list.length} review${list.length === 1 ? "" : "s"}` +
    (active === "All" ? "" : ` in ${active.toLowerCase()}`);

  el("more").style.display = (empty || fullRows(visible) >= rest.length) ? "none" : "";
  observeCards();
}

function setGenre(g){
  if (g === active) return;

  // Direction mirrors the tabs' left-to-right order, not click position -
  // switching to a genre further along GENRES always slides "forward".
  const fwd = GENRES.indexOf(g) > GENRES.indexOf(active);

  active = g;
  visible = PER_PAGE;
  [...el("tabs").children].forEach(b =>
    b.setAttribute("aria-selected", b.dataset.genre === g));
  moveTabIndicator();
  const url = new URL(location);
  g === "All" ? url.searchParams.delete("genre") : url.searchParams.set("genre", g);
  history.replaceState(Object.assign({}, history.state, { visible }), "", url);

  const content = el("tab-content");
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) { render(); return; }

  content.classList.add(fwd ? "tc-out-fwd" : "tc-out-back");
  setTimeout(() => {
    render();
    content.classList.remove("tc-out-fwd", "tc-out-back");
    content.classList.add(fwd ? "tc-in-fwd" : "tc-in-back");
    content.offsetHeight; // force reflow so the "in" starting position commits
    content.classList.remove("tc-in-fwd", "tc-in-back");
  }, 220);
}

el("tabs").innerHTML = GENRES.map(g =>
  `<button class="tab${countIn(g) ? "" : " empty"}" role="tab" type="button" ` +
  `aria-selected="${g === active}" data-genre="${esc(g)}">${esc(g)}</button>`
).join("");

const tabIndicator = document.createElement("span");
tabIndicator.className = "tab-indicator";
tabIndicator.setAttribute("aria-hidden", "true");
el("tabs").appendChild(tabIndicator);

function moveTabIndicator(){
  const activeBtn = el("tabs").querySelector('.tab[aria-selected="true"]');
  if (!activeBtn) { tabIndicator.style.opacity = "0"; return; }
  tabIndicator.style.opacity = "1";
  tabIndicator.style.width  = activeBtn.offsetWidth + "px";
  tabIndicator.style.height = activeBtn.offsetHeight + "px";
  tabIndicator.style.transform = `translate(${activeBtn.offsetLeft}px, ${activeBtn.offsetTop}px)`;
}
moveTabIndicator();
window.addEventListener("resize", moveTabIndicator);
// Tabs render in a fallback font first (the webfonts use display=swap), so
// the very first measurement is against fallback-font widths. Re-measure
// once the real fonts have swapped in and reflowed the tab layout.
if (document.fonts && document.fonts.ready) document.fonts.ready.then(moveTabIndicator);

el("tabs").addEventListener("click", e => {
  const btn = e.target.closest(".tab");
  if (btn) setGenre(btn.dataset.genre);
});

el("empty").addEventListener("click", e => {
  const btn = e.target.closest("[data-goto]");
  if (btn) setGenre(btn.dataset.goto);
});

el("more").addEventListener("click", () => { visible += PER_PAGE; rememberVisible(); render(); });

render();

// ---- on deck: a slim searchable bar (search + "See all" panel) ----
(function () {
  var q = (typeof QUEUE !== "undefined" && window.OnDeck) ? OnDeck.sorted(QUEUE) : [];
  if (!q.length) return;                       // nothing queued, nothing shown

  var input = el("od-q"), panel = el("od-panel"), throb = el("od-throbber"), allBtn = el("od-all");
  var WAIT = 1200;                             // results show this long after the last keystroke
  var timer = null;
  el("ondeck").hidden = false;
  el("ondeck-count").textContent = q.length + " album" + (q.length === 1 ? "" : "s");

  function row(a) {
    return '<li><b>' + esc(a.title) + '</b><span>' + esc(a.artist) + '</span>' +
      (a.year ? '<span class="yr">' + esc(a.year) + '</span>' : "") + '</li>';
  }
  function showAll(open) {
    allBtn.setAttribute("aria-expanded", String(open));
    allBtn.textContent = open ? "Hide" : "See all";
    if (open) { input.value = ""; throb.hidden = true; clearTimeout(timer); panel.innerHTML = '<ul class="od-list">' + q.map(row).join("") + '</ul>'; }
    panel.hidden = !open;
  }
  function results() {
    timer = null;
    throb.hidden = true;
    var term = input.value.trim();
    if (!term) { panel.hidden = true; return; }
    var hits = OnDeck.search(term, q);
    if (!hits.length) {
      panel.innerHTML = '<p class="od-msg">Not on the list yet. You can request it on the ' +
        '<a href="/albums/subscribe#request">Subscribe</a> page.</p>';
    } else {
      panel.innerHTML = (hits[0].loose ? '<p class="od-note">No exact match. Closest:</p>' : "") +
        '<ul class="od-list">' + hits.map(function (h) { return row(h.item); }).join("") + '</ul>';
    }
    panel.hidden = false;
  }

  input.addEventListener("input", function () {
    if (allBtn.getAttribute("aria-expanded") === "true") { allBtn.setAttribute("aria-expanded", "false"); allBtn.textContent = "See all"; }
    clearTimeout(timer);
    if (!input.value.trim()) { throb.hidden = true; panel.hidden = true; return; }
    throb.hidden = false;                      // "working on it" while they type
    timer = setTimeout(results, WAIT);
  });
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); clearTimeout(timer); results(); }
    if (e.key === "Escape") { input.value = ""; clearTimeout(timer); throb.hidden = true; panel.hidden = true; }
  });
  allBtn.addEventListener("click", function () { showAll(allBtn.getAttribute("aria-expanded") !== "true"); });
})();

// ---- cover tilt: cursor-driven 3D tilt on album art, delegated so it keeps
// working after render() replaces the grid on a genre switch ----
(function () {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  var DEG = 5;
  var activeCover = null;

  function applyTilt(cover, e) {
    var r = cover.getBoundingClientRect();
    var px = (e.clientX - r.left) / r.width - 0.5;
    var py = (e.clientY - r.top) / r.height - 0.5;
    cover.style.transform =
      "perspective(700px) rotateX(" + (-py * DEG).toFixed(2) + "deg) " +
      "rotateY(" + (px * DEG).toFixed(2) + "deg) translateY(-3px) scale(1.02)";
  }

  document.addEventListener("mousemove", function (e) {
    var cover = e.target.closest(".cover");
    if (cover !== activeCover && activeCover) activeCover.style.transform = "";
    activeCover = cover;
    if (cover) applyTilt(cover, e);
  });
  document.addEventListener("mouseleave", function () {
    if (activeCover) activeCover.style.transform = "";
    activeCover = null;
  });
})();
</script>

</body>
</html>
