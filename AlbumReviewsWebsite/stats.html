<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<style>html{background:#0e0e0d}</style>
<title>Stats — Album reviews</title>
<meta name="description" content="Score distributions, genre breakdowns, and other stats across Zack Crawford's album reviews.">
<link rel="icon" href="/MainPortfolioPage/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://zackcrawford.com/albums/stats">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zack Crawford">
<meta property="og:title" content="Album Review Stats - Zack Crawford">
<meta property="og:description" content="Score distributions, genre breakdowns, and other stats across Zack Crawford's album reviews.">
<meta property="og:url" content="https://zackcrawford.com/albums/stats">
<meta property="og:image" content="https://zackcrawford.com/MainPortfolioPage/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Zack Crawford, cybersecurity portfolio">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" type="application/rss+xml" title="Ridez — Album Reviews" href="/albums/feed.xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&display=swap" rel="stylesheet">
<style>
:root{
  /* colours come from css/liner.css */
  --wrap:1680px;
  --r:3px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  min-height:100vh;display:flex;flex-direction:column;
  background:var(--paper);
  color:var(--ink);
  font-family:"Instrument Sans",system-ui,sans-serif;
  font-size:16px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--violet);outline-offset:3px;border-radius:2px}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 24px}

/* ---------- masthead ---------- */
.masthead{position:sticky;top:0;z-index:20;background:var(--paper);}
.masthead-inner{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;height:60px}
.mast-tools{justify-self:end;display:flex;align-items:center;gap:18px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:50%;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .28s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:hover{background:var(--haze);border-color:var(--violet);transform:scale(1.18) rotate(-4deg)}
.icon-btn:active{transform:scale(.85)}
.icon-btn svg{transition:transform .28s cubic-bezier(.34,1.56,.64,1)}
.icon-btn:hover svg{transform:scale(1.25)}
.icon-btn svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.6}

/* ---------- stats page ----------
   One scrolling page: headline numbers, then each view in its own section,
   divided by hairline rules. */
.stats{max-width:1100px;margin:0 auto;padding:44px 24px 72px}
.stats h1{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 80;font-weight:800;
  font-size:clamp(34px,5.6vw,54px);line-height:1;letter-spacing:-.035em;margin:0 0 28px;text-align:center}

/* headline numbers */
.figures{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.figure{padding:20px 20px 18px;border-left:1px solid var(--line);min-width:0}
.figure:first-child{border-left:0;padding-left:0}
.figure b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 82;font-weight:800;
  font-size:40px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.figure span{display:block;margin-top:8px;font-size:13px;color:var(--muted)}
.figure a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.figure a:hover{text-decoration-color:var(--violet)}

/* sections */
.block{padding-top:52px}
.block h2{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:"wdth" 82;font-weight:700;
  font-size:14px;letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px}
.block .note{margin:0 0 22px;font-size:13.5px;color:var(--muted)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:56px}

/* scores: every album as a cover in its score column */
.covers-chart{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;align-items:end;padding-bottom:10px}
.cc-col{display:flex;flex-wrap:wrap-reverse;justify-content:center;align-content:flex-start;gap:4px}
.cc-col a{display:block;width:44px;aspect-ratio:1;background:var(--line);border-radius:2px;overflow:hidden;
  outline-offset:2px;transition:transform .15s ease}
.cc-col a:hover,.cc-col a:focus-visible{transform:translateY(-3px)}
.cc-col img{width:100%;height:100%;object-fit:cover;display:block}
.cc-axis{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:10px;text-align:center}
/* baseline under each column, coloured bad -> good with the site's score tiers */
.cc-axis > div::before{content:"";display:block;height:4px;border-radius:2px;background:var(--tier);margin-bottom:10px}
.cc-axis b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.cc-axis span{display:block;font-size:12px;color:var(--muted)}

/* bar lists: genres, decades */
.bars{list-style:none;margin:0;padding:0}
.bars li > *,.bars-head{display:grid;grid-template-columns:110px minmax(0,1fr) 52px 52px;align-items:center;column-gap:18px;padding:8px 0;color:inherit}
.bars li + li > *{border-top:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.bars-head{padding:0 0 6px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bars-head span:nth-child(n+3){text-align:right}
.bars a{border-radius:3px}
.bars a:hover .bar-name{color:var(--ink)}
.bar-name{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-track{display:block;height:10px}
.bar-fill{display:block;height:100%;min-width:4px;background:#cfcac0;border-radius:0 4px 4px 0}
.bars a:hover .bar-fill{background:var(--ink)}
.bar-count,.bar-avg{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar-count{font-size:15px;font-weight:600;color:var(--ink)}
.bar-avg{font-size:14px;color:var(--muted)}

/* highest / lowest */
.rank{list-style:none;margin:0;padding:0;counter-reset:rank}
.rank li{counter-increment:rank}
.rank a{display:grid;grid-template-columns:22px 44px 1fr auto;align-items:center;gap:12px;padding:8px 0;border-top:1px solid var(--line);color:inherit}
.rank li:first-child a{border-top:0}
.rank a::before{content:counter(rank);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rank img{width:44px;height:44px;object-fit:cover;border-radius:2px;background:var(--line);display:block}
.rank .t{min-width:0}
.rank .t b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank .t span{display:block;font-family:"Newsreader",serif;font-style:italic;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank a:hover .t b{color:var(--violet-deep)}

/* hover/focus tooltip for the cover chart */
.chart-tip{position:fixed;z-index:80;pointer-events:none;background:var(--paper);border:1px solid var(--line);
  border-radius:3px;padding:7px 10px;font-size:13px;white-space:nowrap;transform:translate(-50%,-100%);
  margin-top:-8px;opacity:0;transition:opacity .1s ease;box-shadow:0 10px 24px rgba(0,0,0,.4)}
.chart-tip.show{opacity:1}
.chart-tip b{color:var(--ink)}
.chart-tip span{color:var(--muted)}

@media (max-width:860px){
  .figures{grid-template-columns:repeat(2,minmax(0,1fr))}
  .figure:nth-child(3){border-left:0;padding-left:0}
  .figure:nth-child(n+3){border-top:1px solid var(--line)}
  .pair{grid-template-columns:1fr;gap:0}
}
@media (max-width:720px){
  .stats{padding:28px 16px 56px}
  .figure b{font-size:32px}
  .covers-chart,.cc-axis{gap:4px}
  .cc-col{gap:3px}
  .cc-col a{width:calc(50% - 2px);min-width:18px}
  .bars li > *,.bars-head{grid-template-columns:84px minmax(0,1fr) 40px 40px;column-gap:10px}
}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line);background:var(--haze);padding:30px 0;font-size:13px;color:var(--muted);margin-top:auto}
.foot-inner{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.foot-link{color:var(--violet-deep);font-weight:600}
.foot-link:hover{text-decoration:underline}
.foot-home{color:inherit;text-decoration:none}
.foot-home:hover{color:var(--violet-deep)}

@media (max-width:720px){
  .wrap{padding:0 16px}
}

/* ---------- motion ---------- */
/* Page-to-page navigation (cross-document View Transitions). Supported in
   Chromium and Safari 18.2+; other browsers just navigate with no animation
   and no error - this is progressive enhancement, not a requirement. */
@view-transition{navigation:auto}
::view-transition-old(root){animation:page-out .18s ease both}
::view-transition-new(root){animation:page-in .26s ease both}
@keyframes page-out{to{opacity:0}}
@keyframes page-in{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* shared masthead: ZC coin home link + site nav (identical on all five album pages) */
.brand-coin{grid-column:2;justify-self:center;display:grid;place-items:center;width:38px;height:38px;color:var(--ink);border-radius:50%;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
.brand-coin svg{width:100%;height:100%}
.brand-coin:hover{transform:rotate(-14deg) scale(1.08)}
.mast-tools{grid-column:3;justify-self:end;display:flex;align-items:center;gap:22px}
.nav-link{position:relative;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:500;color:var(--muted);padding:6px 0;transition:color .18s ease}
.nav-link:hover{color:var(--ink)}
.nav-link svg{display:none;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6}
.nav-link[aria-current="page"]{color:var(--violet-deep)}
.nav-link[aria-current="page"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px;background:var(--violet)}
@media (max-width:720px){
  .masthead-inner{grid-template-columns:auto 1fr;gap:12px}
  .brand-coin{grid-column:1;justify-self:start;width:34px;height:34px}
  .mast-tools{grid-column:2}
  .mast-tools{gap:6px}
  .nav-link{width:34px;height:34px;justify-content:center;padding:0;border:1px solid var(--line);border-radius:50%}
  .nav-link span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .nav-link svg{display:block}
  .nav-link[aria-current="page"]{border-color:var(--violet);background:var(--haze)}
  .nav-link[aria-current="page"]::after{display:none}
}
</style>
<link rel="stylesheet" href="/albums/css/liner.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="archClip" clipPathUnits="objectBoundingBox">
      <path d="M0,0 L1,0 L1,1 C1,0.236 0.62,0.096 0.5,0.096 C0.38,0.096 0,0.236 0,1 Z" />
    </clipPath>
  </defs>
</svg>

<header class="masthead">
  <div class="wrap masthead-inner">
    <a href="/" class="brand-coin" aria-label="Zack Crawford, back to the portfolio home page" title="Back to portfolio">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="none" stroke="#4fe0c8" stroke-width="2"/>
        <circle cx="32" cy="32" r="24" fill="none" stroke="#9a7bff" stroke-width="1" stroke-dasharray="2 3"/>
        <path d="M20 21h18L20 43h18" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linejoin="miter"/>
        <path d="M47 24a9 9 0 1 0 0 16" fill="none" stroke="#ff6b7d" stroke-width="3.2"/>
      </svg>
    </a>
    <nav class="mast-tools" aria-label="Album reviews">
      <a class="nav-link" href="/albums"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg><span>Reviews</span></a>
      <a class="nav-link" href="/albums/all"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg><span>Browse</span></a>
      <a class="nav-link" href="/albums/stats" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10M12 20V4M19 20v-7"/></svg><span>Stats</span></a>
      <a class="nav-link" href="/albums/subscribe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v12H4z"/><path d="M4 6l8 7 8-7"/></svg><span>Subscribe</span></a>
      <button class="icon-btn" aria-label="Search" data-search-toggle>
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      </button>
    </nav>
  </div>
</header>

<main class="stats" id="stats">
  <h1>Stats</h1>
  <div class="figures" id="figures"></div>

  <section class="block" aria-labelledby="h-scores">
    <h2 id="h-scores">Scores</h2>
    <p class="note">Each cover is one album, stacked by its score.</p>
    <div class="covers-chart" id="covers-chart"></div>
    <div class="cc-axis" id="cc-axis" aria-hidden="true"></div>
  </section>

  <div class="pair">
    <section class="block" aria-labelledby="h-genres">
      <h2 id="h-genres">Genres</h2>
      <p class="note">Albums count toward every genre they belong to.</p>
      <div class="bars-head" aria-hidden="true"><span></span><span></span><span>Albums</span><span>Avg</span></div>
      <ul class="bars" id="genre-bars"></ul>
    </section>
    <section class="block" aria-labelledby="h-decades">
      <h2 id="h-decades">Decades</h2>
      <p class="note">By release year.</p>
      <div class="bars-head" aria-hidden="true"><span></span><span></span><span>Albums</span><span>Avg</span></div>
      <ul class="bars" id="decade-bars"></ul>
    </section>
  </div>

  <div class="pair">
    <section class="block" aria-labelledby="h-top">
      <h2 id="h-top">Highest</h2>
      <ol class="rank" id="top-list"></ol>
    </section>
    <section class="block" aria-labelledby="h-low">
      <h2 id="h-low">Lowest</h2>
      <ol class="rank" id="low-list"></ol>
    </section>
  </div>
</main>

<div class="chart-tip" id="chart-tip" aria-hidden="true"></div>

<footer>
  <div class="wrap foot-inner">
    <a href="/" class="foot-home">Portfolio</a>
    <a href="https://www.albumoftheyear.org/user/ridez/" target="_blank" rel="noopener" class="foot-link">AlbumOfTheYear account</a>
  </div>
</footer>

<script src="/albums/js/score.js"></script>
<script src="/albums/data/reviews-data.js"></script>
<script src="/albums/js/search.js" defer></script>
<script>
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const ALL = (typeof REVIEWS !== "undefined") ? REVIEWS : [];
const tabsOf = r => r.tabs || (r.tab ? [r.tab] : []);
const el = id => document.getElementById(id);
const url = r => "/albums/review/" + encodeURIComponent(r.slug);
const cover = r => "/albums/covers/" + encodeURIComponent(r.slug) + ".jpg";
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const avgOf = list => list.reduce((s, r) => s + r.finalScore, 0) / list.length;
const byScore = [...ALL].sort((a, b) => b.finalScore - a.finalScore || a.title.localeCompare(b.title));

if (ALL.length) {
  // ---------- headline numbers ----------
  const genreCount = {};
  ALL.forEach(r => tabsOf(r).forEach(t => { genreCount[t] = (genreCount[t] || 0) + 1; }));
  const topGenre = Object.keys(genreCount).sort((a, b) => genreCount[b] - genreCount[a])[0];
  const best = byScore[0];
  el("figures").innerHTML = `
    <div class="figure"><b>${ALL.length}</b><span>reviews</span></div>
    <div class="figure"><b>${avgOf(ALL).toFixed(1)}</b><span>average score</span></div>
    <div class="figure"><b>${best.finalScore.toFixed(1)}</b><span>highest: <a href="${url(best)}">${esc(best.title)}</a></span></div>
    <div class="figure"><b>${genreCount[topGenre]}</b><span>${esc(topGenre)}, the most reviewed genre</span></div>`;

  // ---------- scores: covers stacked in whole-score columns ----------
  const lo = Math.min(5, Math.floor(Math.min(...ALL.map(r => r.finalScore))));
  const cols = [];
  for (let v = lo; v <= 10; v++) cols.push({ v, items: byScore.filter(r => Math.min(10, Math.floor(r.finalScore)) === v).reverse() });
  el("covers-chart").innerHTML = cols.map(c => `
    <div class="cc-col" role="list" aria-label="Score ${c.v}${c.v < 10 ? " to " + c.v + ".9" : ""}: ${plural(c.items.length, "album")}">
      ${c.items.map(r => `<a role="listitem" href="${url(r)}" data-tip="${esc(r.title)}" data-sub="${esc(r.artist)} · ${r.finalScore.toFixed(1)}"
        aria-label="${esc(r.title)} by ${esc(r.artist)}, ${r.finalScore.toFixed(1)}"><img src="${cover(r)}" alt="" loading="lazy" onerror="this.remove()"></a>`).join("")}
    </div>`).join("");
  // same bad -> good ramp as the score badges (js/score.js tiers)
  const TIER = { low: "#e5484d", mid: "#f08c3a", ok: "#e3c04c", good: "#9ccc4f", great: "#3fbf74", top: "#34c776" };
  const tierFor = v => v <= 5 ? TIER.low : v === 6 ? TIER.mid : v === 7 ? TIER.ok : v === 8 ? TIER.good : v === 9 ? TIER.great : TIER.top;
  el("cc-axis").innerHTML = cols.map(c => `<div style="--tier:${tierFor(c.v)}"><b>${c.v}</b><span>${c.items.length || "–"}</span></div>`).join("");

  // ---------- bar lists ----------
  const barRow = (name, list, max, href) => {
    const inner = `<span class="bar-name">${esc(name)}</span>
      <span class="bar-track"><span class="bar-fill" style="width:${list.length / max * 100}%"></span></span>
      <span class="bar-count">${list.length}</span>
      <span class="bar-avg">${avgOf(list).toFixed(1)}</span>`;
    return `<li>${href ? `<a href="${href}" aria-label="${esc(name)}: ${plural(list.length, "album")}, average ${avgOf(list).toFixed(1)}">${inner}</a>`
                       : `<div aria-label="${esc(name)}: ${plural(list.length, "album")}, average ${avgOf(list).toFixed(1)}">${inner}</div>`}</li>`;
  };
  const genres = Object.keys(genreCount).sort((a, b) => genreCount[b] - genreCount[a] || a.localeCompare(b));
  const gMax = Math.max(...genres.map(g => genreCount[g]));
  el("genre-bars").innerHTML = genres.map(g =>
    barRow(g, ALL.filter(r => tabsOf(r).includes(g)), gMax, "/albums/all?genre=" + encodeURIComponent(g))).join("");

  const decadeOf = r => { const m = String(r.year || "").match(/\d{4}/); return m ? Math.floor(+m[0] / 10) * 10 : null; };
  const decades = [...new Set(ALL.map(decadeOf).filter(d => d != null))].sort((a, b) => a - b);
  const dLists = decades.map(d => ALL.filter(r => decadeOf(r) === d));
  const dMax = Math.max(...dLists.map(l => l.length));
  el("decade-bars").innerHTML = decades.map((d, i) => barRow(d + "s", dLists[i], dMax)).join("");

  // ---------- highest / lowest ----------
  const rankRow = r => `<li><a href="${url(r)}">
      <img src="${cover(r)}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
      <span class="t"><b>${esc(r.title)}</b><span>${esc(r.artist)}</span></span>
      <span class="sc-pill ${window.scoreClass ? scoreClass(r.finalScore) : ""}">${r.finalScore.toFixed(1)}</span></a></li>`;
  el("top-list").innerHTML = byScore.slice(0, 5).map(rankRow).join("");
  el("low-list").innerHTML = byScore.slice(-5).reverse().map(rankRow).join("");

  // ---------- tooltip for the cover chart (hover and keyboard focus) ----------
  const tip = el("chart-tip");
  const show = a => {
    const r = a.getBoundingClientRect();
    tip.innerHTML = `<b>${esc(a.dataset.tip)}</b> <span>${esc(a.dataset.sub)}</span>`;
    tip.style.left = Math.min(innerWidth - 12 - tip.offsetWidth / 2, Math.max(12 + tip.offsetWidth / 2, r.left + r.width / 2)) + "px";
    tip.style.top = r.top + "px";
    tip.classList.add("show");
  };
  const hide = () => tip.classList.remove("show");
  const chart = el("covers-chart");
  chart.addEventListener("mouseover", e => { const a = e.target.closest("a[data-tip]"); if (a) show(a); });
  chart.addEventListener("mouseout", e => { if (!chart.contains(e.relatedTarget)) hide(); });
  chart.addEventListener("focusin", e => { const a = e.target.closest("a[data-tip]"); if (a) show(a); });
  chart.addEventListener("focusout", hide);
  addEventListener("scroll", hide, { passive: true });
}
</script>

</body>
</html>
