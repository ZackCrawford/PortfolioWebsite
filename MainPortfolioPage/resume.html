<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resume - Zack Crawford</title>

<link rel="icon" href="/MainPortfolioPage/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://zackcrawford.com/resume">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Zack Crawford">
<meta property="og:title" content="Resume - Zack Crawford">
<meta property="og:description" content="Zack Crawford's resume - view or download the PDF.">
<meta property="og:url" content="https://zackcrawford.com/resume">
<meta property="og:image" content="https://zackcrawford.com/MainPortfolioPage/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Zack Crawford, cybersecurity portfolio">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f8;
  --surface:#ffffff;
  --line:#e3e6ec;
  --ink:#171a21;
  --muted:#5b6270;
  --accent:#2856b8;
  --accent-ink:#0e2a5c;
  --wrap:1280px;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 12px 28px -16px rgba(15,23,42,.18);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1115;
    --surface:#181b21;
    --line:#2a2e37;
    --ink:#eef0f3;
    --muted:#9aa1ad;
    --accent:#7ea6e0;
    --accent-ink:#dbe6f8;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 28px -16px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:"Inter",system-ui,-apple-system,Segoe UI,sans-serif;
  line-height:1.55;
}
a{color:inherit}
.container{max-width:var(--wrap);margin:0 auto;padding:0 40px}
@media (max-width:640px){.container{padding:0 20px}}

main{padding:40px 0 70px}

.back-row{display:flex;justify-content:center;margin-bottom:28px}
.back-btn{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--line);color:var(--ink);
  text-decoration:none;font-weight:600;font-size:.9rem;
  padding:10px 20px;border-radius:10px;box-shadow:var(--shadow);
  transition:transform .15s;
}
.back-btn:hover{transform:translateY(-2px)}

.panel{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px;
  box-shadow:var(--shadow);
  max-width:960px;margin:0 auto;
}
.pdf-frame{width:100%;aspect-ratio:8.5/11;border:none;border-radius:8px;display:block;background:var(--bg)}
.fallback{padding:60px 24px;text-align:center;color:var(--muted);font-size:.92rem}
.fallback a{color:var(--accent);font-weight:600}

.actions{max-width:960px;margin:22px auto 0;display:flex;justify-content:center}
.download-btn{
  display:inline-flex;align-items:center;gap:9px;
  background:var(--accent);color:#fff;text-decoration:none;
  font-weight:700;font-size:.92rem;padding:12px 22px;border-radius:10px;
  transition:transform .15s;
}
.download-btn:hover{transform:translateY(-2px)}
.download-btn svg{width:16px;height:16px}
.visually-hidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>

<main>
  <div class="container">
    <h1 class="visually-hidden">Zack Crawford - Resume</h1>
    <div class="back-row">
      <a class="back-btn" href="/">&larr; Back to portfolio</a>
    </div>

    <div class="panel">
      <iframe class="pdf-frame" src="/MainPortfolioPage/resume.pdf" title="Zack Crawford's resume">
        <p class="fallback">Your browser can't preview PDFs inline. <a href="/MainPortfolioPage/resume.pdf" download="Crawford_Zack_07282026.pdf">Download the resume</a> instead.</p>
      </iframe>
    </div>
    <div class="actions">
      <a class="download-btn" href="/MainPortfolioPage/resume.pdf" download="Crawford_Zack_07282026.pdf">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 21h16"/></svg>
        Download PDF
      </a>
    </div>
  </div>
</main>

</body>
</html>
