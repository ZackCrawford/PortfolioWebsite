<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - Zack Crawford</title>
<meta name="description" content="This page doesn't exist on zackcrawford.com.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#05060a">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/MainPortfolioPage/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=Martian+Mono:wdth,wght@75..112.5,300..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#05060a;--ink:#ece9f5;--muted:#8f8ca3;--line:rgba(236,233,245,.14);
  --violet:#9a7bff;--teal:#4fe0c8;--coral:#ff6b7d;
  --mono:"Martian Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{
  margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;
  padding:40px 16px;background:var(--bg);color:var(--ink);font-family:var(--sans);text-align:center;
  background-image:
    radial-gradient(circle,rgba(154,123,255,.35) 1.1px,transparent 1.7px),
    radial-gradient(circle,rgba(79,224,200,.28) 1.1px,transparent 1.7px);
  background-size:14px 24px,14px 24px;background-position:0 0,7px 12px;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(60% 55% at 50% 50%,rgba(5,6,10,.35),var(--bg) 75%);
}
main{position:relative;max-width:560px}
:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.code{
  margin:0;font-family:var(--mono);font-weight:600;font-stretch:78%;
  font-size:clamp(6rem,26vw,11rem);line-height:.9;letter-spacing:-.04em;
  position:relative;display:inline-block;
}
.code::before,.code::after{content:"404";position:absolute;inset:0;mix-blend-mode:screen}
.code::before{color:var(--coral);animation:shift-a 2.8s steps(1,end) infinite}
.code::after{color:var(--teal);animation:shift-b 2.8s steps(1,end) infinite}
@keyframes shift-a{0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}88%{transform:translate(-6px,0);clip-path:inset(15% 0 55% 0)}92%{transform:translate(4px,0);clip-path:inset(60% 0 10% 0)}}
@keyframes shift-b{0%,86%,100%{transform:none;clip-path:inset(0 0 100% 0)}89%{transform:translate(6px,0);clip-path:inset(55% 0 20% 0)}93%{transform:translate(-4px,0);clip-path:inset(10% 0 70% 0)}}
@media (prefers-reduced-motion:reduce){.code::before,.code::after{display:none}}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal);margin:0 0 18px}
h1{margin:18px 0 10px;font-family:var(--mono);font-weight:500;font-size:clamp(1.1rem,3vw,1.5rem);text-transform:uppercase;letter-spacing:.02em}
p.note{margin:0 0 32px;color:#cfccdb}
.path{font-family:var(--mono);font-size:.9em;color:var(--coral);word-break:break-all}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.links a{
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--ink);
  padding:12px 18px;border:1px solid rgba(236,233,245,.32);border-radius:999px;background:rgba(5,6,10,.7);
  transition:border-color .2s,background .2s;
}
.links a:hover{border-color:var(--teal);background:rgba(79,224,200,.1)}
.links a.primary{border-color:rgba(79,224,200,.55);box-shadow:0 0 22px -8px rgba(79,224,200,.6)}
</style>
</head>
<body>
<main>
  <p class="eyebrow">Error</p>
  <p class="code" aria-hidden="true">404</p>
  <h1>Access denied: page not found</h1>
  <p class="note">Nothing lives at <span class="path" id="path">this address</span>. It may have moved, or the link has a typo.</p>
  <nav class="links" aria-label="Where to go next">
    <a class="primary" href="/">Home</a>
    <a href="/#work">Projects</a>
    <a href="/albums">Album Reviews</a>
    <a href="/picoctf">picoCTF Solves</a>
    <a href="/resume">Resume</a>
  </nav>
</main>
<script>
  // Show the address that was requested (as text, never as HTML).
  document.getElementById("path").textContent = location.pathname;
</script>
</body>
</html>
